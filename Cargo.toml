[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
hvw-core = { path = "crates/hvw-core" }
hvw-link = { path = "crates/hvw-link" }
anyhow = "1"
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pty-process = { version = "0.5", features = ["async"] }
ratatui = "0.30"
sha2 = "0.11"
clap = { version = "4.6", features = ["derive", "env"] }
data-encoding = "2.11"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
tempfile = "3"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
